version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ambica_store_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: KARINA@2609
      MYSQL_DATABASE: ambica_store
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: ambica_store_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:KARINA%402609@db:3306/ambica_store
    depends_on:
      - db
    volumes:
      - ./static/uploads:/app/static/uploads

volumes:
  db_data:
