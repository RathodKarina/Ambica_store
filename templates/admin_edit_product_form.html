{% extends 'base.html' %}
{% block content %}

<h2 style="text-align: center;">Edit Product</h2>
<form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
        <label for="name" style="color: var(--text-muted); font-size: 0.9rem;">Product Name</label>
        <input name="name" id="name" placeholder="Product Name" value="{{ product.name }}" required style="width: 100%;">
    </div>
    
    <div style="display: flex; gap: 1rem;">
        <div style="flex: 1;">
            <label for="price" style="color: var(--text-muted); font-size: 0.9rem;">Standard Price (₹)</label>
            <input name="price" id="price" placeholder="Price (₹)" type="number" step="0.01" value="{{ product.price }}" required style="width: 100%;">
        </div>
        <div style="flex: 1;">
            <label for="price_low" style="color: var(--text-muted); font-size: 0.9rem;">Low Range Price (₹)</label>
            <input name="price_low" id="price_low" placeholder="Low Price" type="number" step="0.01" value="{{ product.price_low or '' }}" style="width: 100%;">
        </div>
        <div style="flex: 1;">
            <label for="price_premium" style="color: var(--text-muted); font-size: 0.9rem;">Premium Price (₹)</label>
            <input name="price_premium" id="price_premium" placeholder="Premium Price" type="number" step="0.01" value="{{ product.price_premium or '' }}" style="width: 100%;">
        </div>
    </div>
    
    <div>
        <label for="image" style="color: var(--text-muted); font-size: 0.9rem;">Default / Standard Image</label>
        <input name="image" id="image" type="file" accept="image/*" style="cursor: pointer; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px dashed var(--accent); width: 100%;">
        {% if product.image_url %}
        <p style="text-align: left; color: var(--text-muted); font-size: 0.8rem; margin-top: 5px;">Current: <img src="{{ product.image_url }}" style="max-height: 40px; vertical-align: middle;"></p>
        {% endif %}
    </div>



    <div>
        <label for="description" style="color: var(--text-muted); font-size: 0.9rem;">Description</label>
        <textarea name="description" id="description" placeholder="Product Description..." required style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); color: white; padding: 1rem; border-radius: 8px; font-family: inherit; font-size: 1rem; min-height: 100px; transition: border-color 0.3s ease; width: 100%; box-sizing: border-box;">{{ product.description }}</textarea>
    </div>
    
    <button type="submit" class="btn">Update Product</button>
    <div style="text-align: center; margin-top: 1rem;">
        <a href="/admin/products" style="color: var(--text-muted); text-decoration: none;">⬅ Cancel</a>
    </div>
</form>

{% endblock %}
