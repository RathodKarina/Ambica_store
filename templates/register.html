{% extends 'base.html' %}
{% block content %}

<h2>Create an Account</h2>
<form method="POST">
    <input name="username" placeholder="Choose a Username" required>
    <div style="width: 100%;">
        <input name="phone" type="tel" placeholder="Phone Number (for security)" required style="width: 100%;">
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; text-align: left;">Your phone number is securely encrypted and used for account safety.</p>
    </div>
    <input name="password" type="password" placeholder="Choose a Password" required>
    <button type="submit" class="btn">Register</button>
    <div style="text-align: center; margin-top: 1rem;">
        <span style="color: var(--text-muted)">Already have an account?</span> 
        <a href="/login" style="color: var(--accent); text-decoration: none;">Login</a>
    </div>
</form>

{% endblock %}
