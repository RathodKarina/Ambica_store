{% extends 'base.html' %}
{% block content %}

<div class="glass-card" style="max-width: 800px; margin: 0 auto; text-align: center;">
    {% if product.image_url %}
    <div style="width: 100%; height: 400px; background: rgba(0,0,0,0.05); border-radius: 12px; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center;">
        <img src="{{ product.image_url }}" alt="{{ product.name }}" style="max-width: 100%; max-height: 100%; object-fit: contain;">
    </div>
    {% endif %}

    <h2 style="margin-bottom: 1rem;">{{ product.name }}</h2>
    <p style="font-size: 1.5rem; color: var(--accent); margin-bottom: 2rem;"><strong>Price:</strong> ₹{{ product.price }}</p>

    <div style="background: rgba(0,0,0,0.2); padding: 2rem; border-radius: 12px; margin-bottom: 2rem; text-align: left;">
        <p style="font-size: 1.1rem; line-height: 1.6; color: var(--text-muted);">
            {{ product.description }}
        </p>
    </div>

    {% if not current_user.is_authenticated or not current_user.is_admin %}
    <form action="/add_to_cart/{{ product.id }}" method="POST" style="display: flex; gap: 1rem; justify-content: center; align-items: center;">
        <a href="/products" class="btn-outline">⬅ Back</a>
        <label for="quantity" style="color: var(--text-muted); font-size: 1.1rem; margin-left: 1rem;">Qty:</label>
        <input type="number" name="quantity" id="quantity" value="1" min="1" style="width: 70px; background-color: rgba(255,255,255,0.6); color: var(--text-main); border: 1px solid var(--glass-border); border-radius: 8px; padding: 0.5rem; font-size: 1rem;">
        <button type="submit" class="btn">Add to Cart</button>
    </form>
    {% else %}
    <div style="display: flex; justify-content: center; margin-top: 1rem;">
        <a href="/products" class="btn-outline">⬅ Back to Store</a>
    </div>
    {% endif %}
</div>

{% endblock %}
