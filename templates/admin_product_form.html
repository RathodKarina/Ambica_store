{% extends 'base.html' %}
{% block content %}

<h2 style="text-align: center;">Add New Product</h2>
<form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1rem;">
    <input name="name" placeholder="Product Name" required>
    
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
        <input name="price" placeholder="Standard Price" type="number" step="0.01" required style="width: 100%; box-sizing: border-box; min-width: 0; padding: 0.8rem 0.5rem; font-size: 0.9rem;">
        <input name="price_low" placeholder="Base Price" type="number" step="0.01" style="width: 100%; box-sizing: border-box; min-width: 0; padding: 0.8rem 0.5rem; font-size: 0.9rem;">
        <input name="price_premium" placeholder="Premium Price" type="number" step="0.01" style="width: 100%; box-sizing: border-box; min-width: 0; padding: 0.8rem 0.5rem; font-size: 0.9rem;">
    </div>
    
    <div>
        <label style="color: var(--text-muted); font-size: 0.9rem;">Default / Standard Image</label>
        <input name="image" type="file" accept="image/*" required style="cursor: pointer; padding: 0.8rem; background: rgba(0,0,0,0.2); border: 1px dashed var(--accent); width: 100%;">
    </div>
    


    <textarea name="description" placeholder="Product Description..." required style="background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border); color: white; padding: 1rem; border-radius: 8px; font-family: inherit; font-size: 1rem; min-height: 100px; transition: border-color 0.3s ease; width: 100%; box-sizing: border-box;"></textarea>
    
    <button type="submit" class="btn">Add Product</button>
    <div style="text-align: center; margin-top: 1rem;">
        <a href="/admin/products" style="color: var(--text-muted); text-decoration: none;">⬅ Cancel</a>
    </div>
</form>

{% endblock %}
